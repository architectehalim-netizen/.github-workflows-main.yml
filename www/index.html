<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEKYACHANTIER</title>
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;700;900&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
:root{--p:#1d4ed8;--d:#0b132b;--b:#e2e8f0;--m:#64748b;--g:#059669}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Chivo',sans-serif}
body{background:#faf8ff;color:#1e293b;display:flex;justify-content:center}
.app{width:100%;max-width:440px;min-height:100vh;background:#fff}
header{background:var(--d);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--p);font-weight:900}
.out{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.3);padding:5px 10px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer}
.bar{background:var(--p);color:#fff;padding:10px 16px;font-size:13px;font-weight:700;display:flex;justify-content:space-between}
main{padding:16px}
.hidden{display:none!important}
h1{font-size:24px;font-weight:900;text-align:center;margin:24px 0 18px}
label{font-size:13px;font-weight:700;display:block;margin-bottom:5px}
input,select{width:100%;padding:12px;border:1.5px solid var(--b);border-radius:8px;font-size:14px;font-weight:700;background:#f8fafc;margin-bottom:14px}
.btn{width:100%;border:0;border-radius:8px;padding:14px;font-size:15px;font-weight:800;color:#fff;background:var(--p);cursor:pointer}
.btn.ok{background:var(--g)}.btn:disabled{opacity:.6}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.tab{padding:10px;border:1.5px solid var(--b);background:#f8fafc;border-radius:8px;font-size:12px;font-weight:800;color:var(--m);cursor:pointer}
.tab.on{background:var(--p);border-color:var(--p);color:#fff}
.sec{font-size:12px;font-weight:800;color:var(--m);text-transform:uppercase;margin:4px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.q{border:1px solid var(--b);border-radius:8px;padding:10px}
.q div{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.q b{font-size:12px;color:var(--p)}.q i{font:600 10px 'JetBrains Mono',monospace;background:#f1f5f9;padding:2px 5px;border-radius:4px}
.st{display:flex;border:1px solid var(--b);border-radius:6px;overflow:hidden}
.st button{width:34px;border:0;background:#f8fafc;font-size:16px;font-weight:700;cursor:pointer}
.st input{border:0;border-radius:0;margin:0;padding:6px 0;text-align:center;font-size:15px;background:#fff}
.card{border:1px solid var(--b);border-radius:10px;margin-bottom:12px;padding:14px}
.card summary{cursor:pointer;list-style:none;font-weight:900;display:flex;justify-content:space-between;font-size:15px}
.trk{height:8px;background:var(--b);border-radius:9px;overflow:hidden;margin-top:8px}
.trk span{display:block;height:100%;background:var(--p)}
.bl{margin-top:12px;font-size:12px;font-weight:700}
.bl div{display:flex;justify-content:space-between}
.views{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:-4px 0 16px}
.vb{border:1.5px solid var(--b);background:#f8fafc;border-radius:10px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--m)}
.vb span{font-size:20px;line-height:1}
.vb.on{background:var(--p);border-color:var(--p);color:#fff}
.bg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bb{padding:14px 0;border:1.5px solid var(--b);background:#f8fafc;border-radius:10px;font-size:16px;font-weight:900;color:var(--d);cursor:pointer}
.bb.sel{background:#fed7aa;border-color:#fb923c}
.bb.tot{grid-column:1/-1;background:var(--d);border-color:var(--d);color:#fff}
#mod{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(11,19,43,.55);display:none;align-items:center;justify-content:center;z-index:10;padding:14px}
#mbox{background:#fff;border-radius:14px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;padding:14px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;font-weight:900;font-size:15px}
.mh span{flex:1}
.mx{border:0;background:#f1f5f9;border-radius:8px;min-width:32px;height:32px;padding:0 10px;font-size:14px;font-weight:800;cursor:pointer;color:var(--d)}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mc{border:1px solid var(--b);border-radius:10px;padding:6px 4px;text-align:center;background:#fff;cursor:pointer}
.mc.z{opacity:.45}
.mc img{display:block;width:100%;height:84px;object-fit:contain;margin-bottom:4px}
.mc b{display:block;font-size:10px;color:var(--p);word-break:break-all;line-height:1.2}
.mc em{display:block;font-style:normal;font-size:18px;font-weight:900;color:#b45309}
.md{text-align:center}
.md img{display:block;width:100%;max-height:54vh;object-fit:contain;background:#fff;margin:0 auto 10px}
.md .code{font-size:20px;font-weight:900;color:var(--p)}
.md .sz{font-size:12px;color:var(--m);font-weight:700;margin-top:2px}
.md .qt{font-size:36px;font-weight:900;color:#b45309;margin-top:6px}
.md .nd{padding:40px 0;color:var(--m);font-size:13px;font-weight:700}
.nav{width:100%;margin-bottom:14px;padding:11px;border:1.5px solid var(--p);background:#eff6ff;color:var(--p);border-radius:8px;font-size:13px;font-weight:800;cursor:pointer}
.rp{border:1px solid var(--b);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.rp .rt{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:var(--m)}
.rp .rb{font-size:14px;font-weight:900;margin:4px 0}
.rp .ri{font-size:12px;font-weight:700;line-height:1.9}
.rp .ri span{display:inline-block;background:#f1f5f9;border-radius:6px;padding:1px 6px;margin:0 4px 4px 0}
.del{border:1px solid rgba(239,68,68,.35);background:rgba(239,68,68,.1);color:#b91c1c;border-radius:6px;padding:4px 9px;font-size:12px;font-weight:800;cursor:pointer}
.btn.red{background:#b91c1c}
.err{color:#b91c1c;font-size:12px;font-weight:700;min-height:16px;margin:-8px 0 8px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#b91c1c;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:700;display:none;max-width:90%;z-index:9}
#toast.good{background:var(--g)}
</style>
</head>
<body>
<div class="app">
  <header><img class="logo" alt="TEKYA" style="height:34px;display:block;border-radius:4px"><button class="out hidden" id="lo" onclick="logout()">Déconnexion</button></header>
  <div class="bar hidden" id="info"><span id="i1"></span><span id="i2"></span></div>
  <main>
    <!-- Connexion -->
    <section id="sLogin">
      <img class="logo" alt="TEKYA" style="height:56px;display:block;margin:28px auto 0;border-radius:6px"><h1 style="margin-top:14px">Connexion</h1>
      <label>Identifiant</label><input id="u" autocomplete="username" autocapitalize="off">
      <label>Mot de passe</label><input id="p" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="btn" id="go" onclick="doLogin()">ACCÉDER</button>
    </section>
    <!-- Rapport -->
    <section id="sRep" class="hidden">
      <button class="nav" onclick="showHist()">🕘 MES RAPPORTS ENVOYÉS</button>
      <label>Bloc</label><select id="bloc" onchange="renderTbl()"></select>
      <div class="views">
        <button class="vb" data-v="proposer" onclick="setView('proposer')"><span>📋</span>PROPOSER</button>
        <button class="vb" data-v="realiser" onclick="setView('realiser')"><span>✅</span>RÉALISER</button>
        <button class="vb" data-v="reste" onclick="setView('reste')"><span>⏳</span>RESTE</button>
      </div>
      <div id="entry">
        <div class="sec">Catégorie</div><div class="tabs" id="tabs"></div>
        <div class="sec">Quantités</div><div class="grid" id="grid"></div>
        <button class="btn ok" id="send" onclick="send()">ENREGISTRER LE RAPPORT</button>
      </div>
      <div id="tbl" class="hidden"></div>
    </section>
    <!-- Historique des rapports -->
    <section id="sHist" class="hidden">
      <button class="nav" onclick="backRep()">‹ RETOUR À LA SAISIE</button>
      <div class="sec">Mes rapports envoyés</div><div id="hlist">Chargement…</div>
    </section>
    <!-- Avancement -->
    <section id="sView" class="hidden"><div class="sec">Avancement des travaux</div><div id="vlist">Chargement…</div></section>
  </main>
</div>
<div id="toast"></div>
<div id="mod" onclick="if(event.target===this)closeMod()"><div id="mbox"></div></div>

var API_URL = 'https://script.google.com/macros/s/AKfycbxgehRmb-h-uhy6tiJVjMm-l9efAk5o_tKsNNK7GD4cE2t3N0k90rDMjbKwFMZe3Tgk/exec';
var IN_GOOGLE = typeof google !== 'undefined' && google.script && google.script.run;
function run(fn) {
  var a = [].slice.call(arguments, 1);
  if (IN_GOOGLE) {
    return new Promise(function (ok, ko) { google.script.run.withSuccessHandler(ok).withFailureHandler(ko)[fn](...a); });
  }
  if (!API_URL) return Promise.reject(new Error('API_URL non configurée dans index.html'));
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // requête « simple » : pas de préalable CORS
    body: JSON.stringify({ fn: fn, args: a })
  }).then(function (r) {
    if (!r.ok) throw new Error('Erreur réseau ' + r.status);
    return r.json();
  });
}
function msg(t, good) {
  var e = $('toast'); e.textContent = t; e.className = good ? 'good' : ''; e.style.display = 'block';
  clearTimeout(msg.t); msg.t = setTimeout(function () { e.style.display = 'none'; }, 3500);
}
function show(id) {
  ['sLogin', 'sRep', 'sHist', 'sView'].forEach(function (x) { $(x).classList.toggle('hidden', x !== id); });
  var on = id !== 'sLogin'; $('lo').classList.toggle('hidden', !on); $('info').classList.toggle('hidden', !on);
}

async function doLogin() {
  var u = $('u').value.trim(), p = $('p').value.trim();
  if (!u || !p) return msg('Saisissez identifiant et mot de passe');
  $('go').disabled = true;
  try {
    var r = await run('login', u, p);
    if (!r.success) return msg(r.message);
    S = r; tok = r.token;
    r.role === 'viewer' ? showView() : showRep();
  } catch (e) { msg(String(e.message || e)); } finally { $('go').disabled = false; }
}

function showRep() {
  show('sRep');
  view = null; $('entry').classList.remove('hidden'); $('tbl').classList.add('hidden');
  document.querySelectorAll('.vb').forEach(function (x) { x.classList.remove('on'); });
  $('i1').textContent = 'Chantier : ' + S.chantier; $('i2').textContent = S.name;
  var o = ''; for (var b = 1; b <= S.blocs; b++) o += '<option value="' + b + '">Bloc ' + String(b).padStart(2, '0') + '</option>';
  $('bloc').innerHTML = o;
  cat = S.categories[0];
  $('tabs').innerHTML = S.categories.map(function (c, i) {
    return '<button class="tab' + (i ? '' : ' on') + '" onclick="setCat(' + i + ',this)">' + esc(c) + '</button>';
  }).join('');
  $('grid').innerHTML = S.types.map(function (t, i) {
    return '<div class="q"><div><b>' + esc(t.code) + '</b><i>' + esc(t.size) + '</i></div><div class="st">' +
      '<button onclick="step(' + i + ',-1)">−</button><input id="q' + i + '" type="number" min="0" value="" inputmode="numeric">' +
      '<button onclick="step(' + i + ',1)">+</button></div></div>';
  }).join('');
}
function setCat(i, el) {
  cat = S.categories[i];
  document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('on'); }); el.classList.add('on');
}
function step(i, d) { var e = $('q' + i), v = Math.max(0, (parseInt(e.value, 10) || 0) + d); e.value = v ? v : ''; }

// Tableaux proposer / realiser / reste (icônes sous la liste des blocs)
async function setView(v) {
  view = (view === v) ? null : v;
  document.querySelectorAll('.vb').forEach(function (b) { b.classList.toggle('on', b.dataset.v === view); });
  $('entry').classList.toggle('hidden', !!view);
  $('tbl').classList.toggle('hidden', !view);
  if (!view) return;
  $('tbl').innerHTML = 'Chargement…';
  try {
    var r = await run('getTables', tok);
    if (!r.success) {
      if (r.message === 'SESSION') { msg('Session expirée, reconnectez-vous'); return logout(); }
      return msg(r.message);
    }
    S.tb = r; Object.assign(SIZES, r.sizes || {}); Object.assign(IMGNO, r.imgs || {}); renderTbl();
  } catch (e) { msg(String(e.message || e)); }
}
var TB = {}, MOD = null;
function tblHtml(rows, title, b, key) {
  TB[key] = rows;
  var last = rows.length - 1, h = '<div class="sec">' + esc(title) + '</div><div class="bg">';
  for (var i = 1; i <= last; i++) {
    var lab = String(rows[i][0]).trim(), tot = i === last;
    h += '<button class="bb' + (tot ? ' tot' : '') + (i === b ? ' sel' : '') + '" onclick="openBloc(\'' + key + '\',' + i + ')">' +
      esc(/^\d+$/.test(lab) ? lab.padStart(2, '0') : lab) + '</button>';
  }
  return h + '</div>';
}
function renderTbl() {
  if (!view || !S.tb) return;
  $('tbl').innerHTML = tblHtml(S.tb[view], view, parseInt($('bloc').value, 10), 'r' + view);
}

var IMGNO = {};
// Dessin d'un type : numéro saisi dans DATA (1..n), sinon ancien nom (F1, P2G...)
function imgFor(code) {
  var n = IMGNO[code], k = String(code).split('-').pop().toUpperCase();
  return (n && IMG[String(n)]) || IMG[k] || '';
}
function openMod(html) { $('mbox').innerHTML = html; $('mbox').scrollTop = 0; $('mod').style.display = 'flex'; }
function closeMod() { $('mod').style.display = 'none'; MOD = null; }
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMod(); });
function blocLabel(v) { v = String(v).trim(); return /^\d+$/.test(v) ? 'Bloc ' + v.padStart(2, '0') : v; }
// Fenêtre d'un bloc : tous les types avec image, code et quantité
function openBloc(key, ri) { MOD = { key: key, ri: ri }; showList(); }
function showList() {
  var rows = TB[MOD.key], head = rows[0], r = rows[MOD.ri], g = '';
  for (var j = 3; j < head.length; j++) {
    var code = String(head[j]).trim(), q = String(r[j]).trim(), k = code.split('-').pop().toUpperCase();
    g += '<div class="mc' + ((parseFloat(q) || 0) === 0 ? ' z' : '') + '" onclick="showItem(' + j + ')">' +
      (imgFor(code) ? '<img alt="' + esc(code) + '" src="' + imgFor(code) + '">' : '') + '<b>' + esc(code) + '</b><em>' + esc(q) + '</em></div>';
  }
  openMod('<div class="mh"><span>' + esc(blocLabel(r[0])) + ' · F3 : ' + esc(r[1]) + ' · F4 : ' + esc(r[2]) +
    '</span><button class="mx" onclick="closeMod()">✕</button></div><div class="mg">' + g + '</div>');
}
// Un seul élément : image, code, mmesure et quantité
function showItem(j) {
  var rows = TB[MOD.key], r = rows[MOD.ri], code = String(rows[0][j]).trim(), k = code.split('-').pop().toUpperCase();
  openMod('<div class="mh"><button class="mx" onclick="showList()">‹ Retour</button><span style="text-align:right">' + esc(blocLabel(r[0])) +
    '</span><button class="mx" onclick="closeMod()">✕</button></div><div class="md">' +
    (imgFor(code) ? '<img alt="' + esc(code) + '" src="' + imgFor(code) + '">' : '<div class="nd">Pas de dessin pour ce type</div>') +
    '<div class="code">' + esc(code) + '</div>' + (SIZES[code] ? '<div class="sz">' + esc(SIZES[code]) + '</div>' : '') +
    '<div class="qt">' + esc(r[j]) + '</div></div>');
}
async function vView(i, v) {
  var cur = VV[i] && VV[i].view;
  var box = $('vt' + i);
  VV[i] = VV[i] || {}; VV[i].view = (cur === v) ? null : v;
  document.querySelectorAll('#vb' + i + ' .vb').forEach(function (b) { b.classList.toggle('on', b.dataset.v === VV[i].view); });
  if (!VV[i].view) { box.innerHTML = ''; return; }
  box.innerHTML = 'Chargement…';
  try {
    if (!VV[i].data) {
      var r = await run('getTables', tok, S.list[i].name);
      if (!r.success) {
        box.innerHTML = '';
        if (r.message === 'SESSION') { msg('Session expirée'); return logout(); }
        return msg(r.message);
      }
      VV[i].data = r; Object.assign(SIZES, r.sizes || {}); Object.assign(IMGNO, r.imgs || {});
    }
    if (VV[i].view) box.innerHTML = tblHtml(VV[i].data[VV[i].view], VV[i].view, -1, 'v' + i + VV[i].view);
  } catch (e) { box.innerHTML = ''; msg(String(e.message || e)); }
}

// ===== Historique des rapports : consultation et suppression (confirmée par mot de passe) =====
var HR = [];
function backRep() { show('sRep'); $('i1').textContent = 'Chantier : ' + S.chantier; }
function showHist() { show('sHist'); $('i1').textContent = 'Historique des rapports'; loadHist(); }
function repHtml(x, i) {
  return '<div class="rp"><div class="rt"><span>' + esc(x.date) + ' · ' + esc(x.time) + '</span>' +
    (i === undefined ? '' : '<button class="del" onclick="askDel(' + i + ')">🗑 Supprimer</button>') + '</div>' +
    '<div class="rb">' + esc(blocLabel(x.bloc)) + ' · ' + esc(x.category) + '</div><div class="ri">' +
    x.items.map(function (t) { return '<span>' + esc(t.code) + ' × ' + esc(t.qty) + '</span>'; }).join('') + '</div></div>';
}
async function loadHist() {
  $('hlist').innerHTML = 'Chargement…';
  try {
    var r = await run('getReports', tok);
    if (!r.success) {
      $('hlist').innerHTML = '';
      if (r.message === 'SESSION') { msg('Session expirée, reconnectez-vous'); return logout(); }
      return msg(r.message);
    }
    HR = r.reports;
    $('hlist').innerHTML = HR.map(function (x, i) { return repHtml(x, i); }).join('') || 'Aucun rapport envoyé';
  } catch (e) { $('hlist').innerHTML = ''; msg(String(e.message || e)); }
}
function askDel(i) {
  openMod('<div class="mh"><span>Supprimer ce rapport ?</span><button class="mx" onclick="closeMod()">✕</button></div>' +
    repHtml(HR[i]) +
    '<label>Mot de passe pour confirmer</label><input id="dpw" type="password" autocomplete="off" onkeydown="if(event.key===\'Enter\')doDel(' + i + ')">' +
    '<div class="err" id="derr"></div><button class="btn red" id="dgo" onclick="doDel(' + i + ')">CONFIRMER LA SUPPRESSION</button>');
  setTimeout(function () { var e = $('dpw'); if (e) e.focus(); }, 60);
}
async function doDel(i) {
  var x = HR[i], pw = $('dpw').value.trim();
  if (!pw) { $('derr').textContent = 'Saisissez le mot de passe'; return; }
  $('dgo').disabled = true; $('derr').textContent = '';
  try {
    var r = await run('deleteReport', tok, x.row, x.sig, pw);
    if (r.success) { closeMod(); msg('Rapport supprimé ✔', 1); S.tb = null; loadHist(); }
    else if (r.message === 'SESSION') { closeMod(); msg('Session expirée, reconnectez-vous'); logout(); }
    else { $('derr').textContent = r.message; $('dgo').disabled = false; $('dpw').select(); }
  } catch (e) { $('derr').textContent = String(e.message || e); $('dgo').disabled = false; }
}

async function send() {
  var q = S.types.map(function (t, i) { return parseInt($('q' + i).value, 10) || 0; });
  if (!q.some(function (x) { return x > 0; })) return msg('Saisissez au moins une quantité');
  $('send').disabled = true;
  try {
    var r = await run('saveReport', tok, { bloc: $('bloc').value, category: cat, qty: q });
    if (r.success) { msg('Rapport enregistré ✔', 1); S.types.forEach(function (t, i) { $('q' + i).value = ''; }); }
    else if (r.message === 'SESSION') { msg('Session expirée, reconnectez-vous'); logout(); }
    else msg(r.message);
  } catch (e) { msg(String(e.message || e)); } finally { $('send').disabled = false; }
}

async function showView() {
  show('sView'); $('i1').textContent = 'Avancement des travaux'; $('i2').textContent = S.name;
  try {
    var r = await run('getProgress', tok);
    if (!r.success) { if (r.message === 'SESSION') { msg('Session expirée'); return logout(); } return msg(r.message); }
    S.list = r.chantiers; VV = {};
    $('vlist').innerHTML = r.chantiers.map(function (c, ci) {
      return '<details class="card"><summary><span>' + esc(c.name) + '</span><span>' + c.total + '%</span></summary>' +
        '<div class="trk"><span style="width:' + Math.min(100, c.total) + '%"></span></div>' +
        '<div class="views" id="vb' + ci + '" style="margin:14px 0 10px">' +
        '<button class="vb" data-v="proposer" onclick="vView(' + ci + ',\'proposer\')"><span>📋</span>PROPOSER</button>' +
        '<button class="vb" data-v="realiser" onclick="vView(' + ci + ',\'realiser\')"><span>✅</span>RÉALISER</button>' +
        '<button class="vb" data-v="reste" onclick="vView(' + ci + ',\'reste\')"><span>⏳</span>RESTE</button></div>' +
        '<div id="vt' + ci + '"></div><div class="bl">' +
        c.blocs.map(function (v, i) {
          return '<div style="margin-top:8px"><span>Bloc ' + String(i + 1).padStart(2, '0') + '</span><span>' + v + '%</span></div>' +
            '<div class="trk" style="margin-top:3px;height:5px"><span style="width:' + Math.min(100, v) + '%"></span></div>';
        }).join('') + '</div></details>';
    }).join('') || 'Aucune donnée';
  } catch (e) { msg(String(e.message || e)); }
}

function logout() {
  if (tok) run('logout', tok).catch(function () {});
  tok = null; S = {}; $('u').value = ''; $('p').value = ''; show('sLogin');
}
</script>
</body>
</html>
